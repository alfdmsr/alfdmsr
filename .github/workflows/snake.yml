name: GitHub Snake Game

on:
    # Jadwalkan alur kerja untuk dijalankan setiap hari pada tengah malam UTC.
    schedule:
        - cron: "0 0 * * *"

    # Izinkan pemicuan alur kerja secara manual.
    workflow_dispatch:

    # Picu alur kerja saat terjadi push ke branch utama.
    push:
        branches:
            - main

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            # Step 1: checkout repositori
            - name: Checkout Repository
              uses: actions/checkout@v3


            # Step 2: buat animasi ular
            - name: Generate Github Contributions Snake Animations
              uses: Platane/snk@v3
              with:
                # nama pengguna github untuk menghasilkan animasi
                github_user_name: ${{ github.repository_owner }}

                # tentukan file output dan konfigurasinya
                outputs: |
                    dist/github-snake.svg
                    dist/github-snake-dark.svg?palette=github-dark
                    disk/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
             env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Step 3: Unggah file yang dihasilkan ke cabang 'output'.
            - name: Deploy to Output Branch
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./dist
                publish_branch: output
                
                # opsional
                commit_meassage: "Update snake animation [skip ci]"

