name: Waka Readme

on:
  schedule:
    - cron: "0 */2 * * *" # update setiap 2 jam
  workflow_dispatch: {}

jobs:
  update-readme:
    name: Update WakaTime Stats Profile
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_7_days
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
